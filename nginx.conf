server {
  listen 8080;
  root /usr/share/nginx/html;

  # SPA history fallback — unknown paths serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted assets are immutable; index.html is never cached.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
